<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Account | OneStop Trading</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="topbar">
    Welcome to OneStop Trading 🇬🇭
  </div>

  <div class="header-main">

    <div class="logo">
      OneStop<span>Trading</span>
    </div>

    <a href="index.html" class="back-home">
      ← Back to Shopping
    </a>

  </div>

</header>


<main class="account-page">

  <div class="account-box">

    <h1>My Account</h1>

    <p>
      Sign in to manage your OneStop Trading account.
    </p>


    <form id="login-form">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >


      <button type="submit">
        Sign In
      </button>

    </form>


    <div class="account-divider">
      OR
    </div>


    <a href="#" class="create-account">
      Create a New Account
    </a>

  </div>

</main>


<script src="script.js"></script>

</body>
</html>
