<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | OneStop Trading</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="topbar">
    Welcome to OneStop Trading 🇬🇭
  </div>

  <div class="header-main">

    <div class="logo">
      OneStop<span>Trading</span>
    </div>

    <a href="cart.html" class="back-home">
      ← Back to Cart
    </a>

  </div>

</header>


<main class="checkout-page">

  <h1>Checkout</h1>


  <div class="checkout-layout">

    <!-- Customer Information -->

    <section class="checkout-box">

      <h2>Delivery Information 📍</h2>

      <form id="checkout-form">

        <label for="checkout-name">
          Full Name
        </label>

        <input
          type="text"
          id="checkout-name"
          placeholder="Enter your full name"
          required
        >


        <label for="checkout-phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="checkout-phone"
          placeholder="e.g. 024 123 4567"
          required
        >


        <label for="checkout-region">
          Region
        </label>

        <select id="checkout-region" required>

          <option value="">
            Select your region
          </option>

          <option>Greater Accra</option>
          <option>Ashanti</option>
          <option>Western</option>
          <option>Central</option>
          <option>Eastern</option>
          <option>Volta</option>
          <option>Oti</option>
          <option>Northern</option>
          <option>Savannah</option>
          <option>North East</option>
          <option>Upper East</option>
          <option>Upper West</option>
          <option>Bono</option>
          <option>Bono East</option>
          <option>Ahafo</option>
          <option>Western North</option>

        </select>


        <label for="checkout-city">
          City / Town
        </label>

        <input
          type="text"
          id="checkout-city"
          placeholder="Enter your city or town"
          required
        >


        <label for="checkout-address">
          Delivery Address
        </label>

        <textarea
          id="checkout-address"
          placeholder="House number, street, landmark, etc."
          rows="4"
          required
        ></textarea>


        <h2>Payment Method 💳</h2>

        <div class="payment-options">

          <label class="payment-option">

            <input
              type="radio"
              name="payment"
              value="mobile-money"
              required
            >

            📱 Mobile Money

          </label>


          <label class="payment-option">

            <input
              type="radio"
              name="payment"
              value="card"
            >

            💳 Bank Card

          </label>

        </div>


        <button type="submit" class="place-order-button">
          Continue to Payment
        </button>

      </form>

    </section>


    <!-- Order Summary -->

    <aside class="checkout-summary">

      <h2>Order Summary</h2>

      <div id="checkout-items"></div>

      <div class="checkout-total">

        <span>Total</span>

        <strong id="checkout-total">
          ₵0
        </strong>

      </div>

    </aside>

  </div>

</main>


<script src="script.js"></script>

</body>
</html>
