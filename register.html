<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | OneStop Trading</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="topbar">
    Welcome to OneStop Trading 🇬🇭
  </div>

  <div class="header-main">

    <div class="logo">
      OneStop<span>Trading</span>
    </div>

    <a href="account.html" class="back-home">
      ← Back to Account
    </a>

  </div>

</header>


<main class="account-page">

  <div class="account-box">

    <h1>Create Account</h1>

    <p>
      Join OneStop Trading and start shopping.
    </p>


    <form id="register-form">

      <label for="full-name">
        Full Name
      </label>

      <input
        type="text"
        id="full-name"
        placeholder="Enter your full name"
        required
      >


      <label for="register-email">
        Email Address
      </label>

      <input
        type="email"
        id="register-email"
        placeholder="Enter your email"
        required
      >


      <label for="register-password">
        Password
      </label>

      <input
        type="password"
        id="register-password"
        placeholder="Create a password"
        required
      >


      <label for="confirm-password">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirm-password"
        placeholder="Confirm your password"
        required
      >


      <button type="submit">
        Create Account
      </button>

    </form>


    <div class="account-divider">
      Already have an account?
    </div>


    <a href="account.html" class="create-account">
      Sign In
    </a>

  </div>

</main>


<script src="script.js"></script>

</body>
</html>
